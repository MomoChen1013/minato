:root{--paper:#fff;--ink:#191d1b;--sub:#5e6661;--line:#d6d9d5;--accent:#4c6553}
body{background:#fff;color:var(--ink)}
.project-shell{display:grid;grid-template-columns:minmax(235px,20%) minmax(0,80%);min-height:100vh}
.project-sidebar{height:100dvh;position:sticky;top:0;align-self:start;display:flex;flex-direction:column;padding:clamp(22px,2.5vw,42px) clamp(18px,2.4vw,38px) 26px;background:#fafbf9;border-right:1px solid #d7dcd7;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.sidebar-top{flex:0 0 auto}
.sidebar-brand{display:block;font:700 clamp(17px,1.6vw,25px)/1.25 "Sora",sans-serif;letter-spacing:-.06em}
.sidebar-brand span{display:block;margin-top:6px;font:400 11px/1.5 "Noto Sans TC",sans-serif;letter-spacing:.07em;color:#768079}
.sidebar-statement{font-size:clamp(14px,1.15vw,17px);font-weight:600;line-height:1.75;letter-spacing:-.03em;margin:27px 0 16px}
.sidebar-pill{display:inline-flex;align-items:center;justify-content:space-between;gap:22px;min-width:140px;padding:6px 12px 6px 14px;border:1px solid #424b43;border-radius:30px;font:600 12px/1.3 "Sora",sans-serif;transition:background .2s,color .2s}
.sidebar-pill:hover{background:#253c2e;color:#fff}
.sidebar-pill span{font-size:18px;font-weight:400}
.sidebar-projects{margin-top:clamp(34px,5vh,70px);flex:1 0 auto}
.sidebar-projects h2,.sidebar-bottom h2{font-size:clamp(18px,1.55vw,23px);line-height:1.3;font-weight:600;letter-spacing:-.04em;margin:0 0 10px}
.sidebar-projects h2 span{font:400 11px "Sora",sans-serif;color:#89948b;margin-left:7px}
.sidebar-projects a{display:flex;gap:12px;align-items:baseline;padding:12px 0;border-top:1px solid #cdd4cd;font-size:clamp(12px,.98vw,14px);line-height:1.55;transition:padding .2s}
.sidebar-projects a:last-child{border-bottom:1px solid #cdd4cd}
.sidebar-projects a span{font:500 10px "Sora",sans-serif;color:#88948b}
.sidebar-projects a:hover{padding-left:5px;color:#55735b}
.sidebar-projects a.is-current{font-weight:700;color:#365740}
.sidebar-bottom{flex:0 0 auto;padding-top:28px}
.sidebar-bottom h2{border-bottom:1px solid #cdd4cd;padding-bottom:12px}
.sidebar-bottom p{font-size:clamp(11px,.9vw,13px);line-height:1.95;color:#59685d;margin:12px 0 15px}
.sidebar-cta{width:100%;max-width:190px}
.sidebar-contact{display:block;margin-top:12px;font-size:12px;text-decoration:underline;text-underline-offset:5px}
.project-content{min-width:0}
.project-content .wrap{width:min(100% - clamp(40px,7vw,120px),1050px)}
.project-content .topbar{padding:25px 0;border-bottom:1px solid #cbd1cb}
.project-content .topbar .brand{display:none}
.project-content .topbar:before{content:"SELECTED WORK / 04";font:600 11px "Sora",sans-serif;letter-spacing:.12em}
.project-content .hero{padding:clamp(60px,8vw,115px) 0 55px}
.project-content .hero h1{font-size:clamp(40px,5vw,77px);max-width:900px}
.project-content .story>.wide-image:first-child .story-visual{min-height:360px}
.project-content .chapter{margin-top:clamp(85px,10vw,140px)}
.project-content .chapter:nth-of-type(4){margin-left:0;margin-right:0}
.project-content .nav{margin-bottom:30px}
@media(min-width:1500px){.project-shell{grid-template-columns:20% 80%}.project-sidebar{padding-left:42px;padding-right:42px}}
@media(max-width:1050px){.project-shell{grid-template-columns:255px minmax(0,1fr)}.project-sidebar{padding:25px 20px}.project-content .wrap{width:calc(100% - 58px)}.project-content .hero h1{font-size:clamp(37px,5.2vw,60px)}.project-content .editorial-row{gap:28px}}
@media(max-width:760px){.project-shell{display:block}.project-sidebar{position:relative;height:auto;min-height:0;overflow:visible;padding:20px 19px;border-right:0;border-bottom:1px solid #d7dcd7}.sidebar-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}.sidebar-brand{font-size:20px;margin-right:auto}.sidebar-statement{display:none}.sidebar-top .sidebar-pill{min-width:95px}.sidebar-projects{margin:20px 0 0;flex:auto}.sidebar-projects h2{font-size:14px;margin:0 0 8px}.sidebar-projects h2 span{display:none}.sidebar-projects{display:flex;gap:12px;align-items:center;overflow-x:auto;padding-bottom:5px}.sidebar-projects a{white-space:nowrap;border:0!important;padding:5px 0;font-size:12px}.sidebar-projects a span{display:none}.sidebar-bottom{display:none}.project-content .wrap{width:calc(100% - 38px)}.project-content .topbar{padding:15px 0}.project-content .hero{padding:60px 0 30px}.project-content .hero h1{font-size:clamp(37px,8vw,53px)}.project-content .story>.wide-image:first-child .story-visual{min-height:250px}.project-content .chapter:nth-of-type(4){padding:35px 18px}}
@media(prefers-reduced-motion:reduce){.sidebar-pill,.sidebar-projects a{transition:none}}
.project-content header{display:none}.project-content footer{margin-top:0}.project-content main{min-width:0}.project-content .wrap{width:min(100% - clamp(40px,7vw,120px),1050px)}.project-content .hero{padding-top:85px}@media(max-width:760px){.project-content .wrap{width:calc(100% - 38px)}}.hl{background:none!important;padding:0!important;text-decoration:underline;text-decoration-color:#8da8b5;text-decoration-thickness:2px;text-underline-offset:2px;text-decoration-skip-ink:auto}.eyebrow,.step-label,.sidebar-pill,.sidebar-cta,.sidebar-projects a span{display:none!important}.sidebar-top,.sidebar-bottom,.hero{border-color:transparent!important}.project-sidebar{box-shadow:none!important}</style>
