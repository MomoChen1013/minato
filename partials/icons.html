<!-- 手繪風圖示 sprite：由 /js/include.js 注入到各頁的 #site-icons
     使用方式：<svg class="c-ico" aria-hidden="true"><use href="#ico-compass"/></svg>

     注意：<use> 會建立 shadow tree，外部 CSS 選擇器（例如 .c-ico *）選不到裡面的節點。
     可繼承的 fill / stroke / stroke-width / stroke-linecap / stroke-linejoin 由 .c-ico 往下繼承，
     但 filter 不可繼承，因此筆觸濾鏡與琥珀重點色一律寫在 symbol 內。

     #pencil-ico 與頁面既有的 #pencil 同一種技法（feTurbulence + feDisplacementMap），
     只是把頻率與位移量換算到 56 單位的小尺寸，避免 4.5 單位的位移把圖示扭爛。 -->
<svg id="ico-sprite" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <filter id="pencil-ico" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/>
    </filter>
  </defs>
